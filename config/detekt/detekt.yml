# Overrides on top of detekt's default config (buildUponDefaultConfig = true).

naming:
  # Only counts classes/objects, so a screen file holding its @Serializable route object plus
  # composable functions is flagged. That's the standard Compose layout.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  # A repository's public API is one function per operation; 11 is too tight for that.
  TooManyFunctions:
    thresholdInClasses: 20

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
